
spring:
  profiles:
    active:
  application:
    name: intellectual
  datasource:
    url: jdbc:mysql://localhost:3306/zhuanli?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:xiaojiucheng1226}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: "2"
      logic-not-delete-value: "0"

jwt:
  secret: ${JWT_SECRET:intellectual-jwt-secret-key-2026-please-change-in-production}
  expiration: 86400000

server:
  port: 5050

app:
  upload:
    dir: uploads
  preview:
    gotenberg:
      enabled: ${GOTENBERG_ENABLED:false}
      base-url: ${GOTENBERG_BASE_URL:http://127.0.0.1:3000}
      connect-timeout-seconds: ${GOTENBERG_CONNECT_TIMEOUT_SECONDS:3}
      read-timeout-seconds: ${GOTENBERG_READ_TIMEOUT_SECONDS:70}
      acquire-timeout-seconds: ${GOTENBERG_ACQUIRE_TIMEOUT_SECONDS:5}
      max-concurrent: ${GOTENBERG_MAX_CONCURRENT:2}


